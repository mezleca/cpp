name: ci

on:
    push:
        branches:
          - "osu-stuff-qt"
    workflow_dispatch:

jobs:
    build-test:
        env:
            QT_VERSION: 6.10.3
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      qt_arch: 'linux_gcc_64'
                      target: linux
                    - os: windows-latest
                      qt_arch: 'win64_mingw'
                      target: windows
        runs-on: ${{ matrix.os }}
        steps:
            - name: checkout
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: install system dependencies (ubuntu)
              if: runner.os == 'Linux'
              run: |
                sudo apt-get update
                sudo apt-get install -y git \
                  build-essential \
                  cmake \
                  ninja-build \
                  clang \
                  pkg-config \
                  libicu-dev \
                  libcurl4-openssl-dev \
                  zlib1g-dev

            - name: setup CMake
              uses: lukka/get-cmake@latest
              with:
                useLocalCache: true
                useCloudCache: false

            - name: install Qt6
              if: runner.os == 'Windows' || matrix.target == 'linux'
              uses: jurplel/install-qt-action@v4
              with:
                version: ${{ env.QT_VERSION }}
                target: 'desktop'
                arch: ${{ matrix.qt_arch }}
                cache: true

            - name: install system dependencies (windows)
              if: runner.os == 'Windows'
              uses: msys2/setup-msys2@v2
              with:
                  msystem: MINGW64
                  update: true
                  install: >-
                    base-devel
                    mingw-w64-x86_64-toolchain
                    mingw-w64-x86_64-cmake
                    mingw-w64-x86_64-ninja
                    mingw-w64-x86_64-pkg-config
                    mingw-w64-x86_64-icu
                    mingw-w64-x86_64-curl
                    mingw-w64-x86_64-openssl
                    mingw-w64-x86_64-zlib
                    git

            - name: cache ccache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ccache
                  key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', 'ez', '.gitmodules', 'vendor/**/CMakeLists.txt', 'vendor/**/cmake/**') }}
                  restore-keys: |
                      ${{ runner.os }}-ccache-

            - name: export Qt vars (linux)
              if: runner.os == 'Linux' && matrix.target == 'linux'
              run: |
                echo "Qt6_DIR=${QT_ROOT_DIR}/lib/cmake/Qt6" >> $GITHUB_ENV
              shell: bash

            - name: export Qt vars (windows)
              if: runner.os == 'Windows'
              run: |
                "QT_MINGW_PREFIX=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append
                "QT_HOST_PATH=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append
                "QT_HOST_PATH_CMAKE_DIR=$env:QT_ROOT_DIR\\lib\\cmake" | Out-File -FilePath $env:GITHUB_ENV -Append
                "C:\\msys64\\mingw64\\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
                "C:\\Program Files\\Git\\cmd" | Out-File -FilePath $env:GITHUB_PATH -Append
              shell: pwsh

            - name: build (linux)
              if: matrix.target == 'linux'
              run: |
                python ez init
                python ez clean
                python ez build --type="release"

            - name: build (windows)
              if: matrix.target == 'windows'
              shell: msys2 {0}
              run: |
                python ez init
                python ez clean
                python ez build --type="release"
