name: ci
on:
    push:
        branches:
            - osu-stuff-qt
    pull_request:

jobs:
    build-test:
        env:
            QT_VERSION: 6.6.2
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      qt_arch: 'gcc_64'
                      target: linux
                    - os: ubuntu-latest
                      qt_arch: 'win64_mingw'
                      target: windows
                    - os: windows-latest
                      qt_arch: 'win64_mingw'
                      target: windows
        runs-on: ${{ matrix.os }}
        steps:
            - name: checkout
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: install system dependencies (ubuntu)
              if: runner.os == 'Linux'
              run: |
                sudo apt-get update
                sudo apt-get install -y build-essential cmake ninja-build clang mingw-w64 libz-mingw-w64-dev

            - name: setup CMake
              uses: lukka/get-cmake@latest
              with:
                useLocalCache: true
                useCloudCache: false

            - name: install Qt6
              if: runner.os == 'Windows' || matrix.target == 'linux'
              uses: jurplel/install-qt-action@v4
              with:
                version: ${{ env.QT_VERSION }}
                target: 'desktop'
                arch: ${{ matrix.qt_arch }}
                cache: true

            - name: install Qt6 (linux cross)
              if: runner.os == 'Linux' && matrix.target == 'windows'
              run: |
                python -m pip install aqtinstall==3.3.*
                python -m aqt install-qt windows desktop $QT_VERSION win64_mingw --outputdir ${{ github.workspace }}/Qt
                python -m aqt install-qt linux desktop $QT_VERSION gcc_64 --outputdir ${{ github.workspace }}/Qt-host

            - name: install system dependencies (windows)
              if: runner.os == 'Windows'
              uses: msys2/setup-msys2@v2
              with:
                  msystem: MINGW64
                  update: true
                  install: >-
                      base-devel
                      mingw-w64-x86_64-toolchain

            - name: cache ccache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ccache
                  key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', 'ez', '.gitmodules', 'vendor/**/CMakeLists.txt', 'vendor/**/cmake/**') }}
                  restore-keys: |
                      ${{ runner.os }}-ccache-

            - name: export Qt vars (linux)
              if: runner.os == 'Linux' && matrix.target == 'linux'
              run: |
                echo "CMAKE_PREFIX_PATH=${QT_ROOT_DIR}" >> $GITHUB_ENV
                echo "Qt6_DIR=${QT_ROOT_DIR}/lib/cmake/Qt6" >> $GITHUB_ENV
              shell: bash

            - name: export Qt vars (linux cross)
              if: runner.os == 'Linux' && matrix.target == 'windows'
              run: |
                echo "QT_MINGW_PREFIX=${{ github.workspace }}/Qt/${QT_VERSION}/mingw_64" >> $GITHUB_ENV
                echo "QT_HOST_PATH=${{ github.workspace }}/Qt-host/${QT_VERSION}/gcc_64" >> $GITHUB_ENV
                echo "QT_HOST_PATH_CMAKE_DIR=${{ github.workspace }}/Qt-host/${QT_VERSION}/gcc_64/lib/cmake" >> $GITHUB_ENV
              shell: bash

            - name: export Qt vars (windows)
              if: runner.os == 'Windows'
              run: |
                "QT_MINGW_PREFIX=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append
                "QT_HOST_PATH=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append
                "QT_HOST_PATH_CMAKE_DIR=$env:QT_ROOT_DIR\\lib\\cmake" | Out-File -FilePath $env:GITHUB_ENV -Append
                "C:\\msys64\\mingw64\\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
              shell: pwsh

            - name: configure (linux)
              if: runner.os == 'Linux' && matrix.target == 'linux'
              run: |
                python ez configure --platform=linux

            - name: configure (windows)
              if: matrix.target == 'windows'
              run: |
                python ez configure --platform=windows

            - name: build (ez)
              run: |
                python ez init
                python ez build
